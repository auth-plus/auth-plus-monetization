[project]
name = "auth-plus-monetization"
version = "0.1.0"
description = ""
authors = [
    {name = "AndrewHanasiro",email = "andrewkhanasiro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "fastapi (>=0.135.3,<1.0.0)",
    "uvicorn (>=0.44.0,<1.0.0)",
    "pydantic (>=2.13.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "kafka-python (>=2.3.1,<3.0.0)",
    "gevent (>=26.4.0,<27.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "schedule (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "types-requests (>=2.33.0.20260408,<3.0.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "responses (>=0.26.0,<1.0.0)"
]
[tool.poetry]
package-mode = false

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[[tool.mypy.overrides]]
module = ["kafka", "pook"]
ignore_missing_imports = true