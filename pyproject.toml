[project]
name = "auth-plus-monetization"
version = "0.1.0"
description = ""
authors = [{ name = "AndrewHanasiro", email = "andrewkhanasiro@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "fastapi (>=0.141.0,<1.0.0)",
    "uvicorn (>=0.54.0,<1.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "gevent (>=26.9.0,<27.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "uptrace (>=1.41.0,<2.0.0)",
    "opentelemetry-api (==1.41.0)",
    "opentelemetry-instrumentation-kafka-python (==0.62b0)",
    "opentelemetry-instrumentation-logging (==0.62b0)",
    "opentelemetry-instrumentation-requests (==0.62b0)",
    "opentelemetry-instrumentation-sqlalchemy (==0.62b0)",
    "opentelemetry-instrumentation-fastapi (==0.62b0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "types-requests (>=2.33.0.20260712,<3.0.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "responses (>=0.26.3,<1.0.0)"
]
[tool.poetry]
package-mode = false

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[[tool.mypy.overrides]]
module = ["kafka", "pook", "uptrace.*"]
ignore_missing_imports = true
